<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="title desc">
  <title id="title">An eleven-vertex, fourteen-edge C6-saturated graph</title>
  <desc id="desc">The exact labeled witness J]P?CGIKCC?. Adding the missing edge from vertex 0 to vertex 1 closes the five-edge path through vertices 10, 6, 8, and 4 into a six-cycle.</desc>
  <rect width="600" height="480" rx="12" fill="white"/>
  <g stroke="black" stroke-width="2.5" fill="none">
    <line data-u="0" data-v="2" x1="80" y1="220" x2="300" y2="145"/>
    <line data-u="0" data-v="3" x1="80" y1="220" x2="300" y2="300"/>
    <line data-u="0" data-v="7" x1="80" y1="220" x2="153" y2="65"/>
    <line data-u="0" data-v="10" x1="80" y1="220" x2="110" y2="390"/>
    <line data-u="1" data-v="2" x1="520" y1="220" x2="300" y2="145"/>
    <line data-u="1" data-v="3" x1="520" y1="220" x2="300" y2="300"/>
    <line data-u="1" data-v="4" x1="520" y1="220" x2="490" y2="390"/>
    <line data-u="1" data-v="5" x1="520" y1="220" x2="447" y2="65"/>
    <line data-u="2" data-v="9" x1="300" y1="145" x2="300" y2="220"/>
    <line data-u="3" data-v="9" x1="300" y1="300" x2="300" y2="220"/>
    <line data-u="4" data-v="8" x1="490" y1="390" x2="365" y2="435"/>
    <line data-u="5" data-v="7" x1="447" y1="65" x2="153" y2="65"/>
    <line data-u="6" data-v="8" x1="235" y1="435" x2="365" y2="435"/>
    <line data-u="6" data-v="10" x1="235" y1="435" x2="110" y2="390"/>
  </g>
  <g fill="white" stroke="black" stroke-width="2">
    <circle data-vertex="0" cx="80" cy="220" r="17"/>
    <circle data-vertex="1" cx="520" cy="220" r="17"/>
    <circle data-vertex="2" cx="300" cy="145" r="17"/>
    <circle data-vertex="3" cx="300" cy="300" r="17"/>
    <circle data-vertex="4" cx="490" cy="390" r="17"/>
    <circle data-vertex="5" cx="447" cy="65" r="17"/>
    <circle data-vertex="6" cx="235" cy="435" r="17"/>
    <circle data-vertex="7" cx="153" cy="65" r="17"/>
    <circle data-vertex="8" cx="365" cy="435" r="17"/>
    <circle data-vertex="9" cx="300" cy="220" r="17"/>
    <circle data-vertex="10" cx="110" cy="390" r="17"/>
  </g>
  <g fill="black" text-anchor="middle" dominant-baseline="central" font-family="system-ui, sans-serif" font-size="17">
    <text x="80" y="220">0</text>
    <text x="520" y="220">1</text>
    <text x="300" y="145">2</text>
    <text x="300" y="300">3</text>
    <text x="490" y="390">4</text>
    <text x="447" y="65">5</text>
    <text x="235" y="435">6</text>
    <text x="153" y="65">7</text>
    <text x="365" y="435">8</text>
    <text x="300" y="220">9</text>
    <text x="110" y="390">10</text>
  </g>
</svg>
